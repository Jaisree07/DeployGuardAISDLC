name: DeployGuard AI CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. RUN UNIT TESTS
      # ============================================================

      - name: Run Tests
        run: |
          pytest


      # ============================================================
      # 5. BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker Image
        run: |
          docker build -t deployguard-ai .


      # ============================================================
      # 6. CONFIGURE DEPLOYMENT ENVIRONMENT
      # ============================================================

      - name: Configure Deployment Environment
        run: |
          cat > .env <<EOF
          APP_NAME=DeployGuard AI
          APP_VERSION=1.0.0
          APP_DESCRIPTION=AI-Powered Deployment Verification & Regression Detection Platform
          HOST=0.0.0.0
          PORT=8000
          ENVIRONMENT=development
          DATABASE_URL=sqlite:///./deployguard.db
          LOG_LEVEL=INFO
          AI_PROVIDER=groq
          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=openai/gpt-oss-20b
          EOF


      # ============================================================
      # 7. START DEPLOYGUARD CONTAINERS
      # ============================================================

      - name: Start Containers
        run: |
          docker compose up -d


      # ============================================================
      # 8. VERIFY CONTAINERS
      # ============================================================

      - name: Verify Containers
        run: |
          docker compose ps


      # ============================================================
      # 9. WAIT FOR API
      # ============================================================

      - name: Wait for API
        run: |
          echo "Waiting for DeployGuard API..."

          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "DeployGuard API is ready."
              exit 0
            fi

            echo "Waiting... attempt $i/30"
            sleep 2
          done

          echo "ERROR: DeployGuard API failed to start."

          docker compose logs deployguard-api

          exit 1


      # ============================================================
      # 10. VERIFY HEALTH ENDPOINT
      # ============================================================

      - name: Verify Health Endpoint
        run: |
          echo "========================================"
          echo "HEALTH ENDPOINT VERIFICATION"
          echo "========================================"

          curl --fail http://localhost:8000/health

          echo ""

          echo "========================================"
          echo "HEALTH CHECK PASSED"
          echo "========================================"


      # ============================================================
      # 11. VERIFY METRICS ENDPOINT
      # ============================================================

      - name: Verify Metrics Endpoint
        run: |
          echo "========================================"
          echo "METRICS ENDPOINT VERIFICATION"
          echo "========================================"

          curl --fail http://localhost:8000/metrics

          echo ""

          echo "========================================"
          echo "METRICS CHECK PASSED"
          echo "========================================"


      # ============================================================
      # 12. REGISTER DEPLOYMENT
      # ============================================================

      - name: Register Deployment for ML Verification
        run: |
          echo "========================================"
          echo "REGISTERING DEPLOYMENT"
          echo "========================================"

          curl --fail -X POST \
            http://localhost:8000/deployments/ \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_name": "DeployGuard-CI-Pipeline",
              "version": "1.0.0",
              "environment": "QA",
              "status": "Running"
            }' \
            -o deployment_response.json

          echo ""
          echo "Deployment registration response:"
          cat deployment_response.json


      # ============================================================
      # 13. EXTRACT DEPLOYMENT ID
      # ============================================================

      - name: Extract Deployment ID
        run: |
          DEPLOYMENT_ID=$(python -c "import json; print(json.load(open('deployment_response.json'))['id'])")

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

          echo "Deployment ID: $DEPLOYMENT_ID"


      # ============================================================
      # 14. RETRIEVE DEPLOYMENT TELEMETRY
      # ============================================================

      - name: Retrieve Deployment Telemetry
        run: |
          echo "========================================"
          echo "DEPLOYMENT TELEMETRY"
          echo "========================================"

          curl --fail \
            "http://localhost:8000/telemetry/$DEPLOYMENT_ID" \
            -o telemetry_response.json

          echo ""
          echo "Telemetry response:"
          cat telemetry_response.json


      # ============================================================
      # 15. VALIDATE SIX DEPLOYMENT SIGNALS
      # ============================================================

      - name: Validate Six Deployment Signals
        run: |
          echo "========================================"
          echo "VALIDATING DEPLOYMENT SIGNALS"
          echo "========================================"

          python - <<'PY'
          import json

          with open("telemetry_response.json") as f:
              data = json.load(f)

          required_signals = [
              "cpu_usage",
              "memory_usage",
              "latency",
              "build_duration",
              "deployment_duration",
              "error_count"
          ]

          missing = [
              signal
              for signal in required_signals
              if signal not in data
          ]

          if missing:
              raise SystemExit(
                  f"Missing telemetry signals: {missing}"
              )

          print("All 6 deployment signals collected successfully.")

          print("")
          print("Deployment Signals:")
          print(f"CPU Usage: {data['cpu_usage']}")
          print(f"Memory Usage: {data['memory_usage']}")
          print(f"Latency: {data['latency']}")
          print(f"Build Duration: {data['build_duration']}")
          print(f"Deployment Duration: {data['deployment_duration']}")
          print(f"Error Count: {data['error_count']}")
          PY


      # ============================================================
      # 16. RUN ML PREDICTION
      # ============================================================

      - name: Run ML Prediction
        run: |
          echo "========================================"
          echo "ML DEPLOYMENT PREDICTION"
          echo "========================================"

          python - <<'PY'
          import json
          import requests

          with open("telemetry_response.json") as f:
              telemetry = json.load(f)

          payload = {
              "environment": "QA",
              "cpu_usage": telemetry["cpu_usage"],
              "memory_usage": telemetry["memory_usage"],
              "latency": telemetry["latency"],
              "build_duration": telemetry["build_duration"],
              "deployment_duration": telemetry["deployment_duration"],
              "error_count": telemetry["error_count"]
          }

          response = requests.post(
              "http://localhost:8000/predict/",
              json=payload,
              timeout=120
          )

          response.raise_for_status()

          result = response.json()

          with open("ci_prediction_response.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PY


      # ============================================================
      # 17. RUN DEPLOYGUARD ML VERIFICATION GATE
      # ============================================================

      - name: Run ML Verification Gate
        run: |
          echo "========================================"
          echo "DEPLOYGUARD ML VERIFICATION GATE"
          echo "========================================"

          curl --fail -X POST \
            "http://localhost:8000/verification/$DEPLOYMENT_ID" \
            -H "accept: application/json" \
            -o ci_verification_response.json

          echo ""
          echo "Verification response:"
          cat ci_verification_response.json


      # ============================================================
      # 18. VALIDATE VERIFICATION DECISION
      # ============================================================

      - name: Validate Verification Decision
        run: |
          python - <<'PY'
          import json
          import sys

          with open("ci_verification_response.json") as f:
              result = json.load(f)

          decision = result.get("verification")

          print("")
          print("========================================")
          print(f"ML VERIFICATION DECISION: {decision}")
          print("========================================")

          if decision == "VERIFIED":
              print("DeployGuard ML verification PASSED.")
              sys.exit(0)

          if decision == "BLOCKED":
              print("DeployGuard ML verification BLOCKED the deployment.")
              print("")
              print("Blocked reasons:")

              for reason in result.get("blocked_reasons", []):
                  print(f"- {reason}")

              sys.exit(1)

          print("ERROR: Unknown verification decision.")
          sys.exit(1)
          PY


      # ============================================================
      # 19. VALIDATE ML PREDICTION RESULT
      # ============================================================

      - name: Validate ML Prediction Result
        run: |
          echo "========================================"
          echo "VALIDATING ML PREDICTION"
          echo "========================================"

          python - <<'PY'
          import json

          with open("ci_prediction_response.json") as f:
              result = json.load(f)

          data = result.get("data", {})

          required_fields = [
              "prediction",
              "confidence",
              "risk",
              "anomaly",
              "model_version",
              "ai_explanation"
          ]

          missing = [
              field
              for field in required_fields
              if field not in data
          ]

          if missing:
              raise SystemExit(
                  f"Missing ML prediction fields: {missing}"
              )

          print("ML prediction validated successfully.")
          print("")
          print(f"Prediction: {data['prediction']}")
          print(f"Confidence: {data['confidence']}")
          print(f"Risk: {data['risk']}")
          print(f"Anomaly: {data['anomaly']}")
          print(f"Model Version: {data['model_version']}")
          print(f"AI Explanation: {data['ai_explanation']}")
          PY


      # ============================================================
      # 20. DEPLOYMENT LOGS
      # ============================================================

      - name: Deployment Logs
        if: always()
        run: |
          echo "========================================"
          echo "DEPLOYGUARD CONTAINER LOGS"
          echo "========================================"

          docker compose logs deployguard-api


      # ============================================================
      # 21. STOP CONTAINERS
      # ============================================================

      - name: Stop Containers
        if: always()
        run: |
          docker compose down