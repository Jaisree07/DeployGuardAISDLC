name: DeployGuard AI CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  build-test:

    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ============================================================
      # 4. RUN UNIT TESTS
      # ============================================================

      - name: Run Tests
        run: |

          pytest


      # ============================================================
      # 5. BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker Image
        run: |

          docker build -t deployguard-ai .


      # ============================================================
      # 6. CONFIGURE DEPLOYMENT ENVIRONMENT
      # ============================================================

      - name: Configure Deployment Environment
        run: |

          cat > .env <<EOF

          APP_NAME=DeployGuard AI
          APP_VERSION=1.0.0
          APP_DESCRIPTION=AI-Powered Deployment Verification & Regression Detection Platform

          HOST=0.0.0.0
          PORT=8000

          ENVIRONMENT=development

          DATABASE_URL=sqlite:///./deployguard.db

          LOG_LEVEL=INFO

          AI_PROVIDER=groq
          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=openai/gpt-oss-20b

          OLLAMA_URL=http://host.docker.internal:11434
          OLLAMA_MODEL=phi3:mini

          AI_FALLBACK_PROVIDER=ollama

          EOF


      # ============================================================
      # 7. CREATE CLEAN CI DATABASE
      #
      # IMPORTANT:
      # CI should test a fresh deployment.
      # Historical QA demo records must not influence the CI gate.
      # ============================================================

      - name: Prepare Clean CI Database
        run: |

          echo "========================================"
          echo "PREPARING CLEAN CI DATABASE"
          echo "========================================"

          rm -f deployguard.db

          echo "Fresh SQLite database will be created by DeployGuard."


      # ============================================================
      # 8. START ACTUAL DEPLOYMENT
      # ============================================================

      - name: Deploy DeployGuard Application
        run: |

          echo "========================================"
          echo "DEPLOYING DEPLOYGUARD AI"
          echo "========================================"

          docker compose down --remove-orphans || true

          docker compose up -d --build

          echo ""

          echo "Docker deployment started."


      # ============================================================
      # 9. VERIFY CONTAINERS
      # ============================================================

      - name: Verify Containers
        run: |

          echo "========================================"
          echo "CONTAINER STATUS"
          echo "========================================"

          docker compose ps


      # ============================================================
      # 10. WAIT FOR API
      # ============================================================

      - name: Wait for API
        run: |

          echo "========================================"
          echo "WAITING FOR DEPLOYGUARD API"
          echo "========================================"

          for i in {1..30}; do

            if curl -sf http://localhost:8000/health; then

              echo ""
              echo "DeployGuard API is ready."

              exit 0

            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done


          echo ""
          echo "ERROR: DeployGuard API failed to start."

          echo ""
          echo "Container status:"

          docker compose ps


          echo ""
          echo "Container logs:"

          docker compose logs deployguard-api


          exit 1


      # ============================================================
      # 11. VERIFY HEALTH ENDPOINT
      # ============================================================

      - name: Verify Health Endpoint
        run: |

          echo "========================================"
          echo "HEALTH ENDPOINT VERIFICATION"
          echo "========================================"

          curl --fail \
            http://localhost:8000/health

          echo ""

          echo "HEALTH CHECK PASSED."


      # ============================================================
      # 12. VERIFY METRICS ENDPOINT
      # ============================================================

      - name: Verify Metrics Endpoint
        run: |

          echo "========================================"
          echo "PROMETHEUS METRICS VERIFICATION"
          echo "========================================"

          curl --fail \
            http://localhost:8000/metrics \
            -o metrics_response.txt

          echo ""

          echo "Checking required DeployGuard metrics..."

          grep -q "deployment_created_total" metrics_response.txt
          grep -q "prediction_requests_total" metrics_response.txt
          grep -q "deployguard_deployment_info" metrics_response.txt
          grep -q "deployguard_deployment_risk" metrics_response.txt
          grep -q "deployguard_regression_detected" metrics_response.txt

          echo ""
          echo "PROMETHEUS METRICS CHECK PASSED."


      # ============================================================
      # 13. REGISTER DEPLOYMENT
      # ============================================================

      - name: Register Deployment
        run: |

          echo "========================================"
          echo "REGISTERING DEPLOYMENT"
          echo "========================================"

          curl --fail \
            -X POST \
            http://localhost:8000/deployments/ \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_name": "DeployGuard-CI-Pipeline",
              "version": "1.0.0",
              "environment": "QA",
              "status": "Running"
            }' \
            -o deployment_response.json


          echo ""

          echo "Deployment registration response:"

          cat deployment_response.json


      # ============================================================
      # 14. EXTRACT DEPLOYMENT ID
      # ============================================================

      - name: Extract Deployment ID
        run: |

          DEPLOYMENT_ID=$(python -c "
          import json
          data = json.load(open('deployment_response.json'))
          print(data['id'])
          ")

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

          echo ""
          echo "Deployment ID: $DEPLOYMENT_ID"


      # ============================================================
      # 15. RETRIEVE DEPLOYMENT TELEMETRY
      # ============================================================

      - name: Retrieve Deployment Telemetry
        run: |

          echo "========================================"
          echo "DEPLOYMENT TELEMETRY"
          echo "========================================"

          curl --fail \
            "http://localhost:8000/telemetry/$DEPLOYMENT_ID" \
            -o telemetry_response.json


          echo ""

          echo "Telemetry response:"

          cat telemetry_response.json


      # ============================================================
      # 16. VALIDATE SIX DEPLOYMENT SIGNALS
      # ============================================================

      - name: Validate Six Deployment Signals
        run: |

          echo "========================================"
          echo "VALIDATING SIX DEPLOYMENT SIGNALS"
          echo "========================================"

          python - <<'PY'

          import json


          with open("telemetry_response.json") as f:

              data = json.load(f)


          required_signals = [

              "cpu_usage",
              "memory_usage",
              "latency",
              "build_duration",
              "deployment_duration",
              "error_count"

          ]


          missing = [

              signal
              for signal in required_signals
              if signal not in data

          ]


          if missing:

              raise SystemExit(
                  f"Missing telemetry signals: {missing}"
              )


          print("")

          print("All 6 deployment signals collected successfully.")

          print("")

          print("CPU Usage:",
                data["cpu_usage"])

          print("Memory Usage:",
                data["memory_usage"])

          print("Latency:",
                data["latency"])

          print("Build Duration:",
                data["build_duration"])

          print("Deployment Duration:",
                data["deployment_duration"])

          print("Error Count:",
                data["error_count"])

          PY


      # ============================================================
      # 17. RUN ML PREDICTION
      # ============================================================

      - name: Run ML Prediction
        run: |

          echo "========================================"
          echo "ML DEPLOYMENT PREDICTION"
          echo "========================================"

          python - <<'PY'

          import json
          import requests


          with open("telemetry_response.json") as f:

              telemetry = json.load(f)


          payload = {

              "environment": "QA",

              "cpu_usage":
                  telemetry["cpu_usage"],

              "memory_usage":
                  telemetry["memory_usage"],

              "latency":
                  telemetry["latency"],

              "build_duration":
                  telemetry["build_duration"],

              "deployment_duration":
                  telemetry["deployment_duration"],

              "error_count":
                  telemetry["error_count"]

          }


          print("")

          print("Telemetry sent to ML engine:")

          print(
              json.dumps(
                  payload,
                  indent=2
              )
          )


          response = requests.post(

              "http://localhost:8000/predict/",

              json=payload,

              timeout=120

          )


          response.raise_for_status()


          result = response.json()


          with open(
              "ci_prediction_response.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )


          print("")

          print("ML Prediction Response:")

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          PY


      # ============================================================
      # 18. VALIDATE ML PREDICTION RESULT
      # ============================================================

      - name: Validate ML Prediction Result
        run: |

          echo "========================================"
          echo "VALIDATING ML PREDICTION"
          echo "========================================"

          python - <<'PY'

          import json


          with open(
              "ci_prediction_response.json"
          ) as f:

              response = json.load(f)


          if response.get("success") is not True:

              raise SystemExit(
                  "ML prediction API did not return success=true."
              )


          data = response.get(
              "data",
              {}
          )


          required_fields = [

              "prediction",
              "confidence",
              "risk",
              "anomaly",
              "model_version",
              "ai_explanation"

          ]


          missing = [

              field
              for field in required_fields
              if field not in data

          ]


          if missing:

              raise SystemExit(
                  f"Missing ML prediction fields: {missing}"
              )


          print("")

          print("ML prediction validated successfully.")

          print("")

          print("Prediction:",
                data["prediction"])

          print("Confidence:",
                data["confidence"])

          print("Risk:",
                data["risk"])

          print("Anomaly:",
                data["anomaly"])

          print("Model Version:",
                data["model_version"])

          print("AI Explanation:",
                data["ai_explanation"])

          PY


      # ============================================================
      # 19. RUN DEPLOYGUARD ML VERIFICATION GATE
      # ============================================================

      - name: Run ML Verification Gate
        run: |

          echo "========================================"
          echo "DEPLOYGUARD ML VERIFICATION GATE"
          echo "========================================"

          curl --fail \
            -X POST \
            "http://localhost:8000/verification/$DEPLOYMENT_ID" \
            -H "accept: application/json" \
            -o ci_verification_response.json


          echo ""

          echo "Verification response:"

          cat ci_verification_response.json


      # ============================================================
      # 20. VALIDATE VERIFICATION DECISION
      # ============================================================

      - name: Validate Verification Decision
        run: |

          echo "========================================"
          echo "VALIDATING DEPLOYMENT VERIFICATION"
          echo "========================================"

          python - <<'PY'

          import json
          import sys


          with open(
              "ci_verification_response.json"
          ) as f:

              result = json.load(f)


          decision = result.get(
              "verification"
          )


          print("")

          print("========================================")

          print(
              f"ML VERIFICATION DECISION: {decision}"
          )

          print("========================================")


          print("")

          print("========== BLOCKED REASONS ==========")


          blocked_reasons = result.get(
              "blocked_reasons",
              []
          )


          if blocked_reasons:

              for reason in blocked_reasons:

                  print(
                      f"- {reason}"
                  )

          else:

              print("None")


          print("")

          print("========== REGRESSION DETAILS ==========")


          regressions = result.get(
              "regressions",
              []
          )


          if regressions:

              for regression in regressions:

                  print(
                      json.dumps(
                          regression,
                          indent=2
                      )
                  )

          else:

              print(
                  "No regression detected."
              )


          print("")

          print("========== ML PREDICTION ==========")


          print(
              json.dumps(
                  result.get(
                      "ml_prediction",
                      {}
                  ),
                  indent=2
              )
          )


          print("")

          print("========== TELEMETRY ==========")


          print(
              json.dumps(
                  result.get(
                      "telemetry",
                      {}
                  ),
                  indent=2
              )
          )


          print("")

          print("========== AI ANALYSIS ==========")


          print(
              json.dumps(
                  result.get(
                      "ai_analysis",
                      {}
                  ),
                  indent=2
              )
          )


          if decision == "VERIFIED":

              print("")
              print(
                  "DeployGuard ML verification PASSED."
              )

              sys.exit(0)


          if decision == "BLOCKED":

              print("")
              print(
                  "DeployGuard ML verification BLOCKED the deployment."
              )

              print("")
              print(
                  "The CI deployment gate has failed."
              )

              sys.exit(1)


          print("")

          print(
              "ERROR: Unknown verification decision."
          )

          sys.exit(1)

          PY


      # ============================================================
      # 21. VERIFY AI EXPLANATION
      # ============================================================

      - name: Verify AI Explanation
        run: |

          echo "========================================"
          echo "VERIFYING AI EXPLANATION"
          echo "========================================"

          python - <<'PY'

          import json


          with open(
              "ci_prediction_response.json"
          ) as f:

              response = json.load(f)


          data = response.get(
              "data",
              {}
          )


          explanation = data.get(
              "ai_explanation"
          )


          if not explanation:

              raise SystemExit(
                  "AI explanation was not generated."
              )


          print("")

          print(
              "AI-assisted deployment analysis generated successfully."
          )

          print("")

          print("AI Explanation:")

          print(explanation)

          PY


      # ============================================================
      # 22. DEPLOYMENT SUMMARY
      # ============================================================

      - name: Deployment Summary
        if: always()
        run: |

          echo "========================================"
          echo "DEPLOYGUARD AI CI SUMMARY"
          echo "========================================"

          echo "Deployment ID: ${DEPLOYMENT_ID:-N/A}"

          echo ""

          if [ -f deployment_response.json ]; then

            echo "Deployment Response:"

            cat deployment_response.json

          fi


          echo ""

          if [ -f ci_prediction_response.json ]; then

            echo "ML Prediction:"

            cat ci_prediction_response.json

          fi


          echo ""

          if [ -f ci_verification_response.json ]; then

            echo "Verification:"

            cat ci_verification_response.json

          fi


      # ============================================================
      # 23. DEPLOYMENT LOGS
      # ============================================================

      - name: Deployment Logs
        if: always()
        run: |

          echo "========================================"
          echo "DEPLOYGUARD CONTAINER LOGS"
          echo "========================================"

          docker compose logs deployguard-api


      # ============================================================
      # 24. STOP CONTAINERS
      # ============================================================

      - name: Stop Containers
        if: always()
        run: |

          docker compose down --remove-orphans