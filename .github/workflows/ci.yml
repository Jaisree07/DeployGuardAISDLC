name: DeployGuard AI CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  # ============================================================
  # BUILD AND TEST
  # ============================================================

  build-test:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. RUN UNIT TESTS
      # ============================================================

      - name: Run Tests
        run: |
          pytest


      # ============================================================
      # 5. BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker Image
        run: |
          docker build -t deployguard-ai .


      # ============================================================
      # 6. CONFIGURE DEPLOYMENT ENVIRONMENT
      # ============================================================

      - name: Configure Deployment Environment
        run: |
          cat > .env <<EOF
          APP_NAME=DeployGuard AI
          APP_VERSION=1.0.0
          APP_DESCRIPTION=AI-Powered Deployment Verification & Regression Detection Platform
          HOST=0.0.0.0
          PORT=8000
          ENVIRONMENT=development
          DATABASE_URL=sqlite:///./deployguard.db
          LOG_LEVEL=INFO
          AI_PROVIDER=groq
          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=openai/gpt-oss-20b
          EOF

          echo "Deployment environment configured."


      # ============================================================
      # 7. START DOCKER CONTAINERS
      # ============================================================

      - name: Start Containers
        run: |
          docker compose up -d


      # ============================================================
      # 8. VERIFY CONTAINERS
      # ============================================================

      - name: Verify Containers
        run: |
          docker compose ps


      # ============================================================
      # 9. WAIT FOR API
      # ============================================================

      - name: Wait for API
        run: |
          echo "Waiting for DeployGuard API..."

          for i in {1..30}; do

            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "DeployGuard API is ready."
              exit 0
            fi

            echo "Waiting... attempt $i/30"
            sleep 2

          done

          echo "ERROR: DeployGuard API failed to start."

          docker compose logs deployguard-api

          exit 1


      # ============================================================
      # 10. VERIFY HEALTH ENDPOINT
      # ============================================================

      - name: Verify Health Endpoint
        run: |
          echo "========================================"
          echo "HEALTH ENDPOINT VERIFICATION"
          echo "========================================"

          curl --fail http://localhost:8000/health

          echo ""
          echo "========================================"
          echo "HEALTH CHECK PASSED"
          echo "========================================"


      # ============================================================
      # 11. VERIFY METRICS ENDPOINT
      # ============================================================

      - name: Verify Metrics Endpoint
        run: |
          echo "========================================"
          echo "METRICS ENDPOINT VERIFICATION"
          echo "========================================"

          curl --fail http://localhost:8000/metrics

          echo ""
          echo "========================================"
          echo "METRICS CHECK PASSED"
          echo "========================================"


      # ============================================================
      # 12. COLLECT DEPLOYGUARD LOGS
      # ============================================================

      - name: Deployment Logs
        if: always()
        run: |
          echo "========================================"
          echo "DEPLOYGUARD CONTAINER LOGS"
          echo "========================================"

          docker compose logs deployguard-api


      # ============================================================
      # 13. STOP CONTAINERS
      # ============================================================

      - name: Stop Containers
        if: always()
        run: |
          docker compose down