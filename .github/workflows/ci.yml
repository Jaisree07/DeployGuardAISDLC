name: DeployGuard AI CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  build-test:

    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ============================================================
      # 4. UNIT TESTS
      # ============================================================

      - name: Run Tests
        run: |

          pytest


      # ============================================================
      # 5. BUILD DOCKER IMAGE
      # ============================================================

      - name: Build Docker Image
        run: |

          docker build -t deployguard-ai .


      # ============================================================
      # 6. CONFIGURE ENVIRONMENT
      # ============================================================

      - name: Configure Deployment Environment
        run: |

          cat > .env <<EOF
          APP_NAME=DeployGuard AI
          APP_VERSION=1.0.0
          APP_DESCRIPTION=AI-Powered Deployment Verification & Regression Detection Platform
          HOST=0.0.0.0
          PORT=8000
          ENVIRONMENT=development
          DATABASE_URL=sqlite:///./deployguard.db
          LOG_LEVEL=INFO
          AI_PROVIDER=groq
          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=openai/gpt-oss-20b
          OLLAMA_URL=http://host.docker.internal:11434
          OLLAMA_MODEL=phi3:mini
          AI_FALLBACK_PROVIDER=ollama
          EOF


      # ============================================================
      # 7. CLEAN CI DATABASE
      # ============================================================

      - name: Prepare Clean CI Database
        run: |

          rm -f deployguard.db

          echo "Clean CI database prepared."


      # ============================================================
      # 8. ACTUAL DOCKER DEPLOYMENT
      # ============================================================

      - name: Deploy DeployGuard Application
        run: |

          echo "========================================"
          echo "DEPLOYING DEPLOYGUARD AI"
          echo "========================================"

          docker compose down --remove-orphans || true

          docker compose up -d --build

          echo "DeployGuard Docker deployment started."


      # ============================================================
      # 9. VERIFY CONTAINER
      # ============================================================

      - name: Verify Containers
        run: |

          docker compose ps


      # ============================================================
      # 10. WAIT FOR API
      # ============================================================

      - name: Wait for API
        run: |

          echo "Waiting for DeployGuard API..."

          for i in {1..30}; do

            if curl -sf http://localhost:8000/health; then

              echo ""
              echo "DeployGuard API is ready."

              exit 0

            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done


          echo "ERROR: API failed to start."

          docker compose logs deployguard-api

          exit 1


      # ============================================================
      # 11. HEALTH CHECK
      # ============================================================

      - name: Verify Health Endpoint
        run: |

          echo "========================================"
          echo "HEALTH CHECK"
          echo "========================================"

          curl --fail \
            http://localhost:8000/health

          echo ""

          echo "HEALTH CHECK PASSED."


      # ============================================================
      # 12. METRICS CHECK
      # ============================================================

      - name: Verify Metrics Endpoint
        run: |

          echo "========================================"
          echo "PROMETHEUS METRICS CHECK"
          echo "========================================"

          curl --fail \
            http://localhost:8000/metrics \
            -o metrics_response.txt

          grep -q "deployment_created_total" metrics_response.txt

          grep -q "prediction_requests_total" metrics_response.txt

          echo ""

          echo "PROMETHEUS METRICS CHECK PASSED."


      # ============================================================
      # 13. REGISTER DEPLOYMENT
      # ============================================================

      - name: Register Deployment
        run: |

          echo "========================================"
          echo "REGISTERING DEPLOYMENT"
          echo "========================================"

          curl --fail \
            -X POST \
            http://localhost:8000/deployments/ \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_name": "DeployGuard-CI-Pipeline",
              "version": "1.0.0",
              "environment": "QA",
              "status": "Running"
            }' \
            -o deployment_response.json

          cat deployment_response.json


      # ============================================================
      # 14. EXTRACT DEPLOYMENT ID
      # ============================================================

      - name: Extract Deployment ID
        run: |

          DEPLOYMENT_ID=$(python -c "
          import json
          data = json.load(open('deployment_response.json'))
          print(data['id'])
          ")

          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

          echo ""

          echo "Deployment ID: $DEPLOYMENT_ID"


      # ============================================================
      # 15. CREATE HEALTHY DEPLOYMENT TELEMETRY
      #
      # This is a controlled CI verification scenario.
      # It allows the ML gate to validate a known-good deployment.
      # ============================================================

      - name: Create Healthy Deployment Telemetry
        run: |

          echo "========================================"
          echo "CREATING HEALTHY DEPLOYMENT TELEMETRY"
          echo "========================================"

          python - <<'PY'

          import json
          import requests
          import os


          deployment_id = int(
              os.environ["DEPLOYMENT_ID"]
          )


          payload = {

              "deployment_id": deployment_id,

              "cpu_usage": 35.0,

              "memory_usage": 40.0,

              "latency": 120.0,

              "build_duration": 60.0,

              "deployment_duration": 45.0,

              "error_count": 0

          }


          print("Telemetry payload:")

          print(
              json.dumps(
                  payload,
                  indent=2
              )
          )


          response = requests.post(

              "http://localhost:8000/telemetry/",

              json=payload,

              timeout=30

          )


          response.raise_for_status()


          telemetry = response.json()


          print("")

          print("Telemetry created successfully:")

          print(
              json.dumps(
                  telemetry,
                  indent=2
              )
          )


          with open(
              "telemetry_response.json",
              "w"
          ) as f:

              json.dump(
                  telemetry,
                  f,
                  indent=2
              )

          PY


      # ============================================================
      # 16. VALIDATE SIX TELEMETRY SIGNALS
      # ============================================================

      - name: Validate Six Deployment Signals
        run: |

          python - <<'PY'

          import json


          with open(
              "telemetry_response.json"
          ) as f:

              data = json.load(f)


          required = [

              "deployment_id",
              "cpu_usage",
              "memory_usage",
              "latency",
              "build_duration",
              "deployment_duration",
              "error_count"

          ]


          missing = [

              field
              for field in required
              if field not in data

          ]


          if missing:

              raise SystemExit(
                  f"Missing telemetry fields: {missing}"
              )


          if data["deployment_id"] <= 0:

              raise SystemExit(
                  "Invalid deployment ID."
              )


          print("")

          print(
              "ALL SIX DEPLOYMENT SIGNALS VALIDATED."
          )

          print("")

          print(
              f"CPU: {data['cpu_usage']}"
          )

          print(
              f"Memory: {data['memory_usage']}"
          )

          print(
              f"Latency: {data['latency']}"
          )

          print(
              f"Build Duration: {data['build_duration']}"
          )

          print(
              f"Deployment Duration: {data['deployment_duration']}"
          )

          print(
              f"Errors: {data['error_count']}"
          )

          PY


      # ============================================================
      # 17. RUN ML PREDICTION
      # ============================================================

      - name: Run ML Prediction
        run: |

          python - <<'PY'

          import json
          import requests


          with open(
              "telemetry_response.json"
          ) as f:

              telemetry = json.load(f)


          payload = {

              "environment": "QA",

              "cpu_usage":
                  telemetry["cpu_usage"],

              "memory_usage":
                  telemetry["memory_usage"],

              "latency":
                  telemetry["latency"],

              "build_duration":
                  telemetry["build_duration"],

              "deployment_duration":
                  telemetry["deployment_duration"],

              "error_count":
                  telemetry["error_count"]

          }


          print("")

          print(
              "ML INPUT TELEMETRY:"
          )

          print(
              json.dumps(
                  payload,
                  indent=2
              )
          )


          response = requests.post(

              "http://localhost:8000/predict/",

              json=payload,

              timeout=120

          )


          response.raise_for_status()


          result = response.json()


          with open(
              "ci_prediction_response.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )


          print("")

          print(
              "ML PREDICTION:"
          )

          print(
              json.dumps(
                  result,
                  indent=2
              )
          )

          PY


      # ============================================================
      # 18. VALIDATE ML RESULT
      # ============================================================

      - name: Validate ML Prediction Result
        run: |

          python - <<'PY'

          import json


          with open(
              "ci_prediction_response.json"
          ) as f:

              response = json.load(f)


          if response.get("success") is not True:

              raise SystemExit(
                  "ML prediction failed."
              )


          data = response.get(
              "data",
              {}
          )


          required = [

              "prediction",
              "confidence",
              "risk",
              "anomaly",
              "model_version",
              "ai_explanation"

          ]


          missing = [

              field
              for field in required
              if field not in data

          ]


          if missing:

              raise SystemExit(
                  f"Missing ML fields: {missing}"
              )


          print("")

          print(
              "ML PREDICTION VALIDATION PASSED."
          )

          print("")

          print(
              "Prediction:",
              data["prediction"]
          )

          print(
              "Confidence:",
              data["confidence"]
          )

          print(
              "Risk:",
              data["risk"]
          )

          print(
              "Anomaly:",
              data["anomaly"]
          )

          print(
              "Model:",
              data["model_version"]
          )

          PY


      # ============================================================
      # 19. RUN REAL VERIFICATION GATE
      # ============================================================

      - name: Run ML Verification Gate
        run: |

          echo "========================================"
          echo "DEPLOYGUARD ML VERIFICATION"
          echo "========================================"

          curl --fail \
            -X POST \
            "http://localhost:8000/verification/$DEPLOYMENT_ID" \
            -H "accept: application/json" \
            -o ci_verification_response.json


          echo ""

          cat ci_verification_response.json


      # ============================================================
      # 20. VALIDATE VERIFICATION
      # ============================================================

      - name: Validate Verification Decision
        run: |

          python - <<'PY'

          import json
          import sys


          with open(
              "ci_verification_response.json"
          ) as f:

              result = json.load(f)


          decision = result.get(
              "verification"
          )


          print("")

          print(
              "========================================"
          )

          print(
              f"ML VERIFICATION DECISION: {decision}"
          )

          print(
              "========================================"
          )


          print("")

          print(
              "========== BLOCKED REASONS =========="
          )


          reasons = result.get(
              "blocked_reasons",
              []
          )


          if reasons:

              for reason in reasons:

                  print(
                      f"- {reason}"
                  )

          else:

              print("None")


          print("")

          print(
              "========== REGRESSION DETAILS =========="
          )


          regressions = result.get(
              "regressions",
              []
          )


          if regressions:

              for regression in regressions:

                  print(
                      json.dumps(
                          regression,
                          indent=2
                      )
                  )

          else:

              print(
                  "No regression detected."
              )


          print("")

          print(
              "========== ML RESULT =========="
          )


          print(
              json.dumps(
                  result.get(
                      "ml_prediction",
                      {}
                  ),
                  indent=2
              )
          )


          if decision == "VERIFIED":

              print("")

              print(
                  "DEPLOYGUARD ML VERIFICATION PASSED."
              )

              sys.exit(0)


          if decision == "BLOCKED":

              print("")

              print(
                  "DEPLOYGUARD ML VERIFICATION BLOCKED."
              )

              sys.exit(1)


          print(
              "Unknown verification decision."
          )

          sys.exit(1)

          PY


      # ============================================================
      # 21. VERIFY AI EXPLANATION
      # ============================================================

      - name: Verify AI Explanation
        run: |

          python - <<'PY'

          import json


          with open(
              "ci_prediction_response.json"
          ) as f:

              response = json.load(f)


          explanation = response[
              "data"
          ].get(
              "ai_explanation",
              ""
          )


          if not explanation:

              raise SystemExit(
                  "AI explanation is empty."
              )


          if explanation.startswith(
              "[AI explanation unavailable"
          ):

              raise SystemExit(
                  "AI provider failed."
              )


          print("")

          print(
              "AI EXPLANATION GENERATED SUCCESSFULLY."
          )

          print("")

          print(explanation)

          PY


      # ============================================================
      # 22. FINAL METRICS
      # ============================================================

      - name: Collect Final Metrics
        if: always()
        run: |

          echo "========================================"
          echo "FINAL DEPLOYGUARD METRICS"
          echo "========================================"

          echo ""
          echo "Checking DeployGuard container status..."
          echo ""

          docker compose ps

          echo ""
          echo "Checking DeployGuard API health..."
          echo ""

          if curl --silent --show-error --fail \
            --max-time 10 \
            http://localhost:8000/health; then

            echo ""
            echo "DeployGuard API is available."
            echo ""

            echo "========================================"
            echo "FINAL PROMETHEUS METRICS"
            echo "========================================"

            curl --silent --show-error --fail \
              --max-time 10 \
              http://localhost:8000/metrics

            echo ""
            echo "========================================"
            echo "FINAL METRICS COLLECTION COMPLETED"
            echo "========================================"

          else

            echo ""
            echo "WARNING: DeployGuard API is unavailable."
            echo "Final metrics could not be collected."
            echo ""

            echo "========================================"
            echo "RECENT DEPLOYGUARD API LOGS"
            echo "========================================"

            docker compose logs --tail=100 deployguard-api || true

            echo ""
            echo "========================================"
            echo "METRICS COLLECTION SKIPPED"
            echo "========================================"

          fi


      # ============================================================
      # 23. DEPLOYMENT LOGS
      # ============================================================

      - name: Deployment Logs
        if: always()
        run: |

          echo "========================================"
          echo "DEPLOYGUARD CONTAINER LOGS"
          echo "========================================"

          docker compose logs deployguard-api


      # ============================================================
      # 24. STOP CONTAINERS
      # ============================================================

      - name: Stop Containers
        if: always()
        run: |

          docker compose down --remove-orphans