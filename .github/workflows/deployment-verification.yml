name: DeployGuard AI Deployment Verification

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master


jobs:

  deployment-verification:

    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}


    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. VERIFY GROQ CONFIGURATION
      # ============================================================

      - name: Verify Groq Configuration
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY is not configured."
            exit 1
          fi

          echo "GROQ_API_KEY is configured."


      # ============================================================
      # 5. BUILD DEPLOYGUARD DOCKER IMAGE
      # ============================================================

      - name: Build DeployGuard Docker Image
        run: |
          docker build -t deployguard-ai .


      # ============================================================
      # 6. CONFIGURE DEPLOYMENT ENVIRONMENT
      # ============================================================

      - name: Configure Deployment Environment
        run: |
          cat > .env <<EOF
          APP_NAME=DeployGuard AI
          APP_VERSION=1.0.0
          APP_DESCRIPTION=AI-Powered Deployment Verification & Regression Detection Platform
          HOST=0.0.0.0
          PORT=8000
          ENVIRONMENT=development
          DATABASE_URL=sqlite:///./deployguard.db
          LOG_LEVEL=INFO
          AI_PROVIDER=groq
          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=openai/gpt-oss-20b
          EOF


      # ============================================================
      # 7. START DEPLOYGUARD SERVICES
      # ============================================================

      - name: Start DeployGuard Services
        run: |
          docker compose up -d


      # ============================================================
      # 8. VERIFY CONTAINERS
      # ============================================================

      - name: Verify Containers
        run: |
          docker compose ps


      # ============================================================
      # 9. WAIT FOR DEPLOYGUARD API
      # ============================================================

      - name: Wait for DeployGuard API
        run: |
          echo "Waiting for DeployGuard API..."

          for i in {1..30}; do

            if curl -sf http://localhost:8000/health; then

              echo ""
              echo "DeployGuard API is ready."

              exit 0

            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done

          echo "DeployGuard API failed to start."

          docker compose logs deployguard-api

          exit 1


      # ============================================================
      # 10. REGISTER DEPLOYMENT WITH DEPLOYGUARD
      # ============================================================

      - name: Register Deployment with DeployGuard
        run: |

          echo "Registering deployment with DeployGuard..."

          RESPONSE=$(curl --fail \
            -X POST \
            http://localhost:8000/deployments/ \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_name": "DeployGuard-CI-${{ github.run_number }}",
              "version": "${{ github.sha }}",
              "environment": "QA",
              "status": "Running"
            }')

          echo "Deployment Registration Response:"

          echo "$RESPONSE"

          echo "$RESPONSE" | python -m json.tool

          echo "$RESPONSE" > deployment_response.json


      # ============================================================
      # 11. VALIDATE DEPLOYMENT REGISTRATION
      # ============================================================

      - name: Validate Deployment Registration
        run: |

          python - <<'PY'

          import json

          with open("deployment_response.json") as f:
              data = json.load(f)

          required_fields = [
              "id",
              "deployment_name",
              "version",
              "environment",
              "status",
              "created_at"
          ]

          for field in required_fields:

              assert field in data, \
                  f"Missing deployment field: {field}"

          assert data["environment"] == "QA"

          assert data["status"] == "Running"

          print("")

          print("========================================")
          print("DEPLOYMENT REGISTRATION PASSED")
          print("========================================")

          print("Deployment ID:", data["id"])
          print("Deployment Name:", data["deployment_name"])
          print("Version:", data["version"])
          print("Environment:", data["environment"])
          print("Status:", data["status"])
          print("Created At:", data["created_at"])

          print("========================================")

          PY


      # ============================================================
      # 12. COLLECT DEPLOYMENT TELEMETRY
      # ============================================================

      - name: Collect Deployment Telemetry
        run: |

          DEPLOYMENT_ID=$(python -c "
          import json

          with open('deployment_response.json') as f:
              data = json.load(f)

          print(data['id'])
          ")

          echo "Deployment ID: $DEPLOYMENT_ID"

          echo "Collecting telemetry for deployment..."

          TELEMETRY_RESPONSE=$(curl --fail \
            http://localhost:8000/telemetry/$DEPLOYMENT_ID)

          echo "Telemetry Response:"

          echo "$TELEMETRY_RESPONSE"

          echo "$TELEMETRY_RESPONSE" | python -m json.tool

          echo "$TELEMETRY_RESPONSE" > telemetry_response.json


      # ============================================================
      # 13. VALIDATE DEPLOYMENT TELEMETRY
      # ============================================================

      - name: Validate Deployment Telemetry
        run: |

          python - <<'PY'

          import json

          with open("telemetry_response.json") as f:
              data = json.load(f)

          required_fields = [
              "id",
              "deployment_id",
              "cpu_usage",
              "memory_usage",
              "latency",
              "build_duration",
              "deployment_duration",
              "error_count",
              "collected_at"
          ]

          for field in required_fields:

              assert field in data, \
                  f"Missing telemetry field: {field}"

          assert data["deployment_id"] > 0

          print("")

          print("========================================")
          print("DEPLOYMENT TELEMETRY VALIDATION PASSED")
          print("========================================")

          print("Deployment ID:", data["deployment_id"])
          print("CPU Usage:", data["cpu_usage"])
          print("Memory Usage:", data["memory_usage"])
          print("Latency:", data["latency"])
          print("Build Duration:", data["build_duration"])
          print("Deployment Duration:", data["deployment_duration"])
          print("Error Count:", data["error_count"])
          print("Collected At:", data["collected_at"])

          print("========================================")

          PY


      # ============================================================
      # 14. VERIFY METRICS ENDPOINT
      # ============================================================

      - name: Verify Metrics Endpoint
        run: |

          curl --fail \
            http://localhost:8000/metrics


      # ============================================================
      # 15. RUN ML DEPLOYMENT VERIFICATION
      #     USING ACTUAL DEPLOYMENT TELEMETRY
      # ============================================================

      - name: Run ML Deployment Verification
        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request

          with open("telemetry_response.json") as f:
              telemetry = json.load(f)

          payload = {
              "environment": "QA",
              "cpu_usage": telemetry["cpu_usage"],
              "memory_usage": telemetry["memory_usage"],
              "latency": telemetry["latency"],
              "build_duration": telemetry["build_duration"],
              "deployment_duration": telemetry["deployment_duration"],
              "error_count": telemetry["error_count"]
          }

          print("")
          print("========================================")
          print("ACTUAL TELEMETRY USED FOR ML")
          print("========================================")

          print(json.dumps(payload, indent=2))

          print("========================================")

          request = urllib.request.Request(
              "http://localhost:8000/predict/",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:

              result = json.loads(
                  response.read().decode("utf-8")
              )

          print("")
          print("========================================")
          print("ML PREDICTION RESPONSE")
          print("========================================")

          print(json.dumps(result, indent=2))

          print("========================================")

          with open("prediction_response.json", "w") as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          PY


      # ============================================================
      # 16. VALIDATE ML PREDICTION
      # ============================================================

      - name: Validate ML Prediction
        run: |

          python - <<'PY'

          import json

          with open("prediction_response.json") as f:
              data = json.load(f)

          assert data["success"] is True

          assert "data" in data

          result = data["data"]

          assert "prediction" in result

          assert "confidence" in result

          assert "risk" in result

          assert "anomaly" in result

          assert "model_version" in result

          print("")

          print("========================================")
          print("ML DEPLOYMENT VERIFICATION PASSED")
          print("========================================")

          print("Prediction:", result["prediction"])
          print("Confidence:", result["confidence"])
          print("Risk:", result["risk"])
          print("Anomaly:", result["anomaly"])
          print("Model Version:", result["model_version"])

          print("========================================")

          PY


      # ============================================================
      # 17. VERIFY AI EXPLANATION
      # ============================================================

      - name: Verify AI Explanation
        run: |

          python - <<'PY'

          import json

          with open("prediction_response.json") as f:
              data = json.load(f)

          explanation = data["data"].get(
              "ai_explanation",
              ""
          )

          print("")

          print("========================================")
          print("AI EXPLANATION")
          print("========================================")

          print(explanation)

          print("========================================")

          if not explanation:

              raise SystemExit(
                  "ERROR: AI explanation is empty."
              )

          if explanation.startswith(
              "[AI explanation unavailable"
          ):

              raise SystemExit(
                  "ERROR: AI provider failed."
              )

          print(
              "AI explanation verification PASSED."
          )

          PY


      # ============================================================
      # 18. COLLECT FINAL DEPLOYGUARD METRICS
      # ============================================================

      - name: Collect Deployment Metrics
        run: |

          echo "========================================"

          echo "FINAL DEPLOYGUARD METRICS"

          echo "========================================"

          curl --fail \
            http://localhost:8000/metrics


      # ============================================================
      # 19. DEPLOYMENT LOGS
      # ============================================================

      - name: Deployment Logs
        if: always()
        run: |

          docker compose logs deployguard-api


      # ============================================================
      # 20. STOP DEPLOYGUARD SERVICES
      # ============================================================

      - name: Stop DeployGuard Services
        if: always()
        run: |

          docker compose down