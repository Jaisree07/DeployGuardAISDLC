name: DeployGuard AI Deployment Verification

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  deployment-verification:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. VERIFY GROQ CONFIGURATION
      # ============================================================

      - name: Verify Groq Configuration
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY is not configured."
            exit 1
          fi

          echo "GROQ_API_KEY is configured."


      # ============================================================
      # 5. BUILD DEPLOYGUARD DOCKER IMAGE
      # ============================================================

      - name: Build DeployGuard Docker Image
        run: |
          docker build -t deployguard-ai .


      # ============================================================
      # 6. CONFIGURE DEPLOYMENT ENVIRONMENT
      # ============================================================

      - name: Configure Deployment Environment
        run: |
          cat > .env <<EOF
          APP_NAME=DeployGuard AI
          APP_VERSION=1.0.0
          APP_DESCRIPTION=AI-Powered Deployment Verification & Regression Detection Platform
          HOST=0.0.0.0
          PORT=8000
          ENVIRONMENT=development
          DATABASE_URL=sqlite:///./deployguard.db
          LOG_LEVEL=INFO
          AI_PROVIDER=groq
          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=openai/gpt-oss-20b
          EOF


      # ============================================================
      # 7. START DEPLOYGUARD SERVICES
      # ============================================================

      - name: Start DeployGuard Services
        run: |
          docker compose up -d


      # ============================================================
      # 8. VERIFY CONTAINERS
      # ============================================================

      - name: Verify Containers
        run: |
          docker compose ps


      # ============================================================
      # 9. WAIT FOR DEPLOYGUARD API
      # ============================================================

      - name: Wait for DeployGuard API
        run: |

          echo "Waiting for DeployGuard API..."

          for i in {1..30}; do

            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "DeployGuard API is ready."
              exit 0
            fi

            echo "Waiting... attempt $i/30"

            sleep 2

          done

          echo "DeployGuard API failed to start."

          docker compose logs deployguard-api

          exit 1


      # ============================================================
      # 10. REGISTER ACTUAL DEPLOYMENT
      # ============================================================

      - name: Register Deployment with DeployGuard
        run: |

          echo "Registering deployment with DeployGuard..."

          RESPONSE=$(curl --fail \
            -X POST \
            http://localhost:8000/deployments/ \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_name": "DeployGuard-CI-${{ github.run_number }}",
              "version": "${{ github.sha }}",
              "environment": "QA",
              "status": "Running"
            }')

          echo "Deployment Registration Response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | python -m json.tool

          echo "$RESPONSE" > deployment_response.json


      # ============================================================
      # 11. VALIDATE DEPLOYMENT REGISTRATION
      # ============================================================

      - name: Validate Deployment Registration
        run: |

          python - <<'PY'
          import json

          with open("deployment_response.json") as f:
              data = json.load(f)

          required_fields = [
              "id",
              "deployment_name",
              "version",
              "environment",
              "status",
              "created_at"
          ]

          for field in required_fields:
              assert field in data, f"Missing deployment field: {field}"

          assert data["environment"] == "QA"
          assert data["status"] == "Running"

          print("")
          print("========================================")
          print("DEPLOYMENT REGISTRATION PASSED")
          print("========================================")
          print("Deployment ID:", data["id"])
          print("Deployment Name:", data["deployment_name"])
          print("Version:", data["version"])
          print("Environment:", data["environment"])
          print("Status:", data["status"])
          print("Created At:", data["created_at"])
          print("========================================")


      # ============================================================
      # 12. VERIFY METRICS ENDPOINT
      # ============================================================

      - name: Verify Metrics Endpoint
        run: |
          curl --fail http://localhost:8000/metrics


      # ============================================================
      # 13. RUN ML DEPLOYMENT VERIFICATION
      # ============================================================

      - name: Run ML Deployment Verification
        run: |

          RESPONSE=$(curl --fail \
            -X POST \
            http://localhost:8000/predict/ \
            -H "Content-Type: application/json" \
            -d '{
              "environment": "QA",
              "cpu_usage": 35.0,
              "memory_usage": 40.0,
              "latency": 120.0,
              "build_duration": 60.0,
              "deployment_duration": 90.0,
              "error_count": 1
            }')

          echo "ML Prediction Response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | python -m json.tool


      # ============================================================
      # 14. VALIDATE ML PREDICTION
      # ============================================================

      - name: Validate ML Prediction
        run: |

          RESPONSE=$(curl --fail \
            -X POST \
            http://localhost:8000/predict/ \
            -H "Content-Type: application/json" \
            -d '{
              "environment": "QA",
              "cpu_usage": 35.0,
              "memory_usage": 40.0,
              "latency": 120.0,
              "build_duration": 60.0,
              "deployment_duration": 90.0,
              "error_count": 1
            }')

          echo "$RESPONSE" | python -c "
          import sys
          import json

          data = json.load(sys.stdin)

          assert data['success'] is True
          assert 'data' in data

          result = data['data']

          assert 'prediction' in result
          assert 'confidence' in result
          assert 'risk' in result
          assert 'anomaly' in result
          assert 'model_version' in result

          print('')
          print('========================================')
          print('ML DEPLOYMENT VERIFICATION PASSED')
          print('========================================')
          print('Prediction:', result['prediction'])
          print('Confidence:', result['confidence'])
          print('Risk:', result['risk'])
          print('Anomaly:', result['anomaly'])
          print('Model Version:', result['model_version'])
          print('========================================')
          "


      # ============================================================
      # 15. VERIFY AI EXPLANATION
      # ============================================================

      - name: Verify AI Explanation
        run: |

          RESPONSE=$(curl --fail \
            -X POST \
            http://localhost:8000/predict/ \
            -H "Content-Type: application/json" \
            -d '{
              "environment": "QA",
              "cpu_usage": 35.0,
              "memory_usage": 40.0,
              "latency": 120.0,
              "build_duration": 60.0,
              "deployment_duration": 90.0,
              "error_count": 1
            }')

          echo "$RESPONSE" | python -c "
          import sys
          import json

          data = json.load(sys.stdin)

          explanation = data['data'].get('ai_explanation', '')

          print('')
          print('========================================')
          print('AI EXPLANATION')
          print('========================================')
          print(explanation)
          print('========================================')

          if not explanation:
              raise SystemExit('ERROR: AI explanation is empty.')

          if explanation.startswith('[AI explanation unavailable'):
              raise SystemExit('ERROR: AI provider failed.')

          print('AI explanation verification PASSED.')
          "


      # ============================================================
      # 16. COLLECT DEPLOYMENT METRICS
      # ============================================================

      - name: Collect Deployment Metrics
        run: |

          echo "========================================"
          echo "FINAL DEPLOYGUARD METRICS"
          echo "========================================"

          curl --fail http://localhost:8000/metrics


      # ============================================================
      # 17. COLLECT DEPLOYMENT LOGS
      # ============================================================

      - name: Deployment Logs
        if: always()
        run: |
          docker compose logs deployguard-api


      # ============================================================
      # 18. STOP DEPLOYGUARD SERVICES
      # ============================================================

      - name: Stop DeployGuard Services
        if: always()
        run: |
          docker compose down