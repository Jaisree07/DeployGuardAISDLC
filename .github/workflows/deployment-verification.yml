name: DeployGuard AI Deployment Verification

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:

  deployment-verification:

    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================================
      # 4. VERIFY GROQ CONFIGURATION
      # ============================================================

      - name: Verify Groq Configuration
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY is not configured."
            exit 1
          fi

          echo "GROQ_API_KEY is configured."


      # ============================================================
      # 5. BUILD DEPLOYGUARD DOCKER IMAGE
      # ============================================================

      - name: Build DeployGuard Docker Image
        run: |
          docker build -t deployguard-ai .


      # ============================================================
      # 6. CONFIGURE DEPLOYMENT ENVIRONMENT
      # ============================================================

      - name: Configure Deployment Environment
        run: |
          cat > .env <<EOF
          APP_NAME=DeployGuard AI
          APP_VERSION=1.0.0
          APP_DESCRIPTION=AI-Powered Deployment Verification & Regression Detection Platform
          HOST=0.0.0.0
          PORT=8000
          ENVIRONMENT=development
          DATABASE_URL=sqlite:///./deployguard.db
          LOG_LEVEL=INFO
          AI_PROVIDER=groq
          GROQ_API_KEY=${GROQ_API_KEY}
          GROQ_MODEL=openai/gpt-oss-20b
          OLLAMA_URL=http://host.docker.internal:11434
          OLLAMA_MODEL=phi3:mini
          AI_FALLBACK_PROVIDER=ollama
          EOF


      # ============================================================
      # 7. START DEPLOYGUARD SERVICES
      # ============================================================

      - name: Start DeployGuard Services
        run: |
          docker compose up -d


      # ============================================================
      # 8. VERIFY CONTAINERS
      # ============================================================

      - name: Verify Containers
        run: |
          docker compose ps


      # ============================================================
      # 9. WAIT FOR DEPLOYGUARD API
      # ============================================================

      - name: Wait for DeployGuard API
        run: |
          echo "Waiting for DeployGuard API..."

          for i in {1..30}; do

            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "DeployGuard API is ready."
              exit 0
            fi

            echo "Waiting... attempt $i/30"
            sleep 2

          done

          echo "DeployGuard API failed to start."

          docker compose logs deployguard-api

          exit 1


      # ============================================================
      # 10. REGISTER DEPLOYMENT WITH DEPLOYGUARD
      # ============================================================

      - name: Register Deployment with DeployGuard
        run: |

          echo "Registering deployment with DeployGuard..."

          RESPONSE=$(curl --fail \
            -X POST \
            http://localhost:8000/deployments/ \
            -H "Content-Type: application/json" \
            -d '{
              "deployment_name": "DeployGuard-CI-${{ github.run_number }}",
              "version": "${{ github.sha }}",
              "environment": "QA",
              "status": "Running"
            }')

          echo "Deployment Registration Response:"
          echo "$RESPONSE"

          echo "$RESPONSE" | python -m json.tool

          echo "$RESPONSE" > deployment_response.json


      # ============================================================
      # 11. VALIDATE DEPLOYMENT REGISTRATION
      # ============================================================

      - name: Validate Deployment Registration
        run: |

          python - <<'PY'

          import json

          with open("deployment_response.json") as f:
              data = json.load(f)

          required_fields = [
              "id",
              "deployment_name",
              "version",
              "environment",
              "status",
              "created_at"
          ]

          for field in required_fields:
              assert field in data, \
                  f"Missing deployment field: {field}"

          assert data["environment"] == "QA"
          assert data["status"] == "Running"

          print("")
          print("========================================")
          print("DEPLOYMENT REGISTRATION PASSED")
          print("========================================")

          print("Deployment ID:", data["id"])
          print("Deployment Name:", data["deployment_name"])
          print("Version:", data["version"])
          print("Environment:", data["environment"])
          print("Status:", data["status"])
          print("Created At:", data["created_at"])

          print("========================================")

          PY


      # ============================================================
      # 12. COLLECT DEPLOYMENT TELEMETRY
      # ============================================================
      #
      # NOTE:
      # This creates telemetry for the CURRENT deployment ID.
      # It prevents verification from accidentally using an old
      # deployment/telemetry record.
      #
      # This is temporary CI telemetry until the real application
      # deployment is connected to DeployGuard.
      #
      # ============================================================

      - name: Collect Deployment Telemetry
        run: |

          DEPLOYMENT_ID=$(python -c "
          import json

          with open('deployment_response.json') as f:
              data = json.load(f)

          print(data['id'])
          ")

          echo "========================================"
          echo "COLLECTING TELEMETRY"
          echo "========================================"

          echo "Deployment ID: $DEPLOYMENT_ID"

          TELEMETRY_RESPONSE=$(curl --fail \
            -X POST \
            http://localhost:8000/telemetry/ \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{
              \"deployment_id\": $DEPLOYMENT_ID,
              \"cpu_usage\": 47.44,
              \"memory_usage\": 72.08,
              \"latency\": 210.71,
              \"build_duration\": 97.37,
              \"deployment_duration\": 72.75,
              \"error_count\": 2
            }")

          echo ""
          echo "Telemetry Response:"
          echo "$TELEMETRY_RESPONSE"

          echo "$TELEMETRY_RESPONSE" | python -m json.tool

          echo "$TELEMETRY_RESPONSE" > telemetry_response.json

          echo "========================================"


      # ============================================================
      # 13. VALIDATE DEPLOYMENT TELEMETRY
      # ============================================================

      - name: Validate Deployment Telemetry
        run: |

          python - <<'PY'

          import json

          with open("deployment_response.json") as f:
              deployment = json.load(f)

          with open("telemetry_response.json") as f:
              telemetry = json.load(f)

          deployment_id = deployment["id"]

          required_fields = [
              "id",
              "deployment_id",
              "cpu_usage",
              "memory_usage",
              "latency",
              "build_duration",
              "deployment_duration",
              "error_count",
              "collected_at"
          ]

          for field in required_fields:
              assert field in telemetry, \
                  f"Missing telemetry field: {field}"

          assert telemetry["deployment_id"] == deployment_id

          print("")
          print("========================================")
          print("DEPLOYMENT TELEMETRY VALIDATION PASSED")
          print("========================================")

          print("Deployment ID:", telemetry["deployment_id"])
          print("CPU Usage:", telemetry["cpu_usage"])
          print("Memory Usage:", telemetry["memory_usage"])
          print("Latency:", telemetry["latency"])
          print("Build Duration:", telemetry["build_duration"])
          print("Deployment Duration:", telemetry["deployment_duration"])
          print("Error Count:", telemetry["error_count"])
          print("Collected At:", telemetry["collected_at"])

          print("========================================")

          PY


      # ============================================================
      # 14. VERIFY METRICS ENDPOINT
      # ============================================================

      - name: Verify Metrics Endpoint
        run: |

          echo "Checking DeployGuard metrics endpoint..."

          curl --fail \
            http://localhost:8000/metrics

          echo ""
          echo "Metrics endpoint verification PASSED."


      # ============================================================
      # 15. RUN DEPLOYMENT VERIFICATION GATE
      # ============================================================
      #
      # IMPORTANT:
      # Do NOT use curl --fail here.
      #
      # We need to capture the response body even if the API returns
      # HTTP 500 so that GitHub Actions shows the actual backend
      # exception.
      #
      # ============================================================

      - name: Run Deployment Verification Gate
        id: verification_gate
        run: |

          DEPLOYMENT_ID=$(python -c "
          import json

          with open('deployment_response.json') as f:
              data = json.load(f)

          print(data['id'])
          ")

          echo "========================================"
          echo "RUNNING DEPLOYMENT VERIFICATION GATE"
          echo "========================================"

          echo "Deployment ID: $DEPLOYMENT_ID"

          HTTP_STATUS=$(curl \
            -s \
            -o verification_response.json \
            -w "%{http_code}" \
            -X POST \
            "http://localhost:8000/verification/$DEPLOYMENT_ID" \
            -H "accept: application/json")

          echo ""
          echo "HTTP STATUS: $HTTP_STATUS"

          echo ""
          echo "VERIFICATION RESPONSE:"

          cat verification_response.json

          echo ""

          if command -v python >/dev/null 2>&1; then
            python -m json.tool verification_response.json || true
          fi

          echo ""
          echo "========================================"

          if [ "$HTTP_STATUS" -ge 500 ]; then

            echo "ERROR: DeployGuard verification API returned HTTP $HTTP_STATUS."

            echo ""
            echo "========================================"
            echo "DEPLOYGUARD API LOGS"
            echo "========================================"

            docker compose logs --tail=200 deployguard-api || true

            echo ""
            echo "========================================"

            exit 1
          fi

          if [ "$HTTP_STATUS" -ge 400 ]; then

            echo "ERROR: DeployGuard verification request failed."

            exit 1
          fi

          echo "Deployment verification API request completed successfully."


      # ============================================================
      # 16. VALIDATE DEPLOYMENT VERIFICATION DECISION
      # ============================================================

      - name: Validate Deployment Verification Decision
        run: |

          python - <<'PY'

          import json

          with open("verification_response.json") as f:
              data = json.load(f)

          assert data["success"] is True

          assert "deployment_id" in data
          assert "verification" in data
          assert "deployment_status" in data

          verification = data["verification"]
          deployment_status = data["deployment_status"]

          print("")
          print("========================================")
          print("DEPLOYMENT VERIFICATION GATE")
          print("========================================")

          print("Deployment ID:", data["deployment_id"])
          print("Deployment Name:", data["deployment_name"])
          print("Environment:", data["environment"])
          print("Verification:", verification)
          print("Deployment Status:", deployment_status)

          print("========================================")

          if verification == "VERIFIED":

              assert deployment_status == "VERIFIED"

              print("")
              print("VERIFICATION RESULT: PASSED")
              print("Deployment is VERIFIED.")
              print("Pipeline is allowed to continue.")
              print("")

          elif verification == "BLOCKED":

              print("")
              print("VERIFICATION RESULT: BLOCKED")

              blocked_reasons = data.get(
                  "blocked_reasons",
                  []
              )

              print("Blocked Reasons:")

              for reason in blocked_reasons:
                  print("-", reason)

              print("")
              print("Deployment failed the verification gate.")

              raise SystemExit(
                  "ERROR: Deployment verification BLOCKED."
              )

          else:

              raise SystemExit(
                  f"ERROR: Unknown verification status: {verification}"
              )

          PY


      # ============================================================
      # 17. RUN ML DEPLOYMENT VERIFICATION
      #     USING CURRENT DEPLOYMENT TELEMETRY
      # ============================================================

      - name: Run ML Deployment Verification
        run: |

          python - <<'PY'

          import json
          import urllib.request

          with open("telemetry_response.json") as f:
              telemetry = json.load(f)

          payload = {
              "environment": "QA",
              "cpu_usage": telemetry["cpu_usage"],
              "memory_usage": telemetry["memory_usage"],
              "latency": telemetry["latency"],
              "build_duration": telemetry["build_duration"],
              "deployment_duration": telemetry["deployment_duration"],
              "error_count": telemetry["error_count"]
          }

          print("")
          print("========================================")
          print("CURRENT DEPLOYMENT TELEMETRY USED FOR ML")
          print("========================================")

          print(json.dumps(payload, indent=2))

          print("========================================")

          request = urllib.request.Request(
              "http://localhost:8000/predict/",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:

              result = json.loads(
                  response.read().decode("utf-8")
              )

          print("")
          print("========================================")
          print("ML PREDICTION RESPONSE")
          print("========================================")

          print(json.dumps(result, indent=2))

          print("========================================")

          with open("prediction_response.json", "w") as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

          PY


      # ============================================================
      # 18. VALIDATE ML PREDICTION
      # ============================================================

      - name: Validate ML Prediction
        run: |

          python - <<'PY'

          import json

          with open("prediction_response.json") as f:
              data = json.load(f)

          assert data["success"] is True

          assert "data" in data

          result = data["data"]

          assert "prediction" in result
          assert "confidence" in result
          assert "risk" in result
          assert "anomaly" in result
          assert "model_version" in result

          print("")
          print("========================================")
          print("ML DEPLOYMENT VERIFICATION PASSED")
          print("========================================")

          print("Prediction:", result["prediction"])
          print("Confidence:", result["confidence"])
          print("Risk:", result["risk"])
          print("Anomaly:", result["anomaly"])
          print("Model Version:", result["model_version"])

          print("========================================")

          PY


      # ============================================================
      # 19. VERIFY AI EXPLANATION
      # ============================================================

      - name: Verify AI Explanation
        run: |

          python - <<'PY'

          import json

          with open("prediction_response.json") as f:
              data = json.load(f)

          explanation = data["data"].get(
              "ai_explanation",
              ""
          )

          print("")
          print("========================================")
          print("AI EXPLANATION")
          print("========================================")

          print(explanation)

          print("========================================")

          if not explanation:
              raise SystemExit(
                  "ERROR: AI explanation is empty."
              )

          if explanation.startswith(
              "[AI explanation unavailable"
          ):
              raise SystemExit(
                  "ERROR: AI provider failed."
              )

          print(
              "AI explanation verification PASSED."
          )

          PY


      # ============================================================
      # 20. COLLECT FINAL DEPLOYGUARD METRICS
      # ============================================================

      - name: Collect Final DeployGuard Metrics
        run: |

          echo "========================================"
          echo "FINAL DEPLOYGUARD METRICS"
          echo "========================================"

          curl --fail \
            http://localhost:8000/metrics

          echo ""
          echo "========================================"


      # ============================================================
      # 21. DEPLOYMENT LOGS
      # ============================================================

      - name: Deployment Logs
        if: always()
        run: |

          echo "========================================"
          echo "DEPLOYGUARD API LOGS"
          echo "========================================"

          docker compose logs --tail=200 deployguard-api

          echo "========================================"


      # ============================================================
      # 22. STOP DEPLOYGUARD SERVICES
      # ============================================================

      - name: Stop DeployGuard Services
        if: always()
        run: |

          docker compose down