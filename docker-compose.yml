name: deployguardaisdlc

services:

  deployguard-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: deployguard-api

    depends_on:
      prometheus:
        condition: service_started
      pushgateway:
        condition: service_started

    environment:
      APP_NAME: ${APP_NAME:-DeployGuard AI}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_DESCRIPTION: ${APP_DESCRIPTION:-AI-Powered Deployment Verification & Regression Detection Platform}

      HOST: ${HOST:-127.0.0.1}
      PORT: ${PORT:-8000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      DATABASE_URL: ${DATABASE_URL:-sqlite:///./deployguard.db}

      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-ollama}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}

      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - deployguard-network

    ports:
      - "8000:8000"

    restart: unless-stopped

    volumes:
      - .:/app


  grafana:
    image: grafana/grafana
    container_name: grafana

    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER}
      GF_SMTP_FROM_NAME: DeployGuard AI

    networks:
      - deployguard-network

    ports:
      - "3000:3000"

    restart: unless-stopped

    volumes:
      - grafana-storage:/var/lib/grafana


  prometheus:
    image: prom/prometheus
    container_name: prometheus

    networks:
      - deployguard-network

    ports:
      - "9090:9090"

    restart: unless-stopped

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml


  pushgateway:
    image: prom/pushgateway
    container_name: pushgateway

    networks:
      - deployguard-network

    ports:
      - "9091:9091"

    restart: unless-stopped


networks:
  deployguard-network:
    name: deployguardaisdlc_deployguard-network


volumes:
  grafana-storage:
    name: deployguardaisdlc_grafana-storage