name: deployguardaisdlc

services:

  deployguard-api:
    build:
      context: /home/jaianandh/Projects/DeployGuardAISDLC
      dockerfile: Dockerfile

    container_name: deployguard-api

    depends_on:
      prometheus:
        condition: service_started
        required: true
      pushgateway:
        condition: service_started
        required: true

    environment:
      AI_FALLBACK_PROVIDER: ollama
      AI_PROVIDER: groq

      APP_DESCRIPTION: AI-Powered Deployment Verification & Regression Detection Platform
      APP_NAME: DeployGuard AI
      APP_VERSION: 1.0.0

      DATABASE_URL: sqlite:///./deployguard.db
      ENVIRONMENT: development

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: openai/gpt-oss-20b

      HOST: 127.0.0.1
      LOG_LEVEL: INFO

      OLLAMA_MODEL: phi3:mini
      OLLAMA_URL: http://host.docker.internal:11434

      PORT: "8000"

    extra_hosts:
      - host.docker.internal=host-gateway

    networks:
      deployguard-network: null

    ports:
      - "8000:8000"

    restart: unless-stopped

    volumes:
      - type: bind
        source: /home/jaianandh/Projects/DeployGuardAISDLC
        target: /app
        bind: {}


  grafana:
    container_name: grafana

    image: grafana/grafana

    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER}
      GF_SMTP_FROM_NAME: "DeployGuard AI"

    networks:
      deployguard-network: null

    ports:
      - "3000:3000"

    restart: unless-stopped

    volumes:
      - type: volume
        source: grafana-storage
        target: /var/lib/grafana
        volume: {}


  prometheus:
    container_name: prometheus

    image: prom/prometheus

    networks:
      deployguard-network: null

    ports:
      - "9090:9090"

    restart: unless-stopped

    volumes:

      # Prometheus configuration
      - type: bind
        source: /home/jaianandh/Projects/DeployGuardAISDLC/monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        bind: {}

      # DeployGuard alert rules
      - type: bind
        source: /home/jaianandh/Projects/DeployGuardAISDLC/monitoring/prometheus/alert_rules.yml
        target: /etc/prometheus/alert_rules.yml
        bind: {}


  pushgateway:
    container_name: pushgateway

    image: prom/pushgateway

    networks:
      deployguard-network: null

    ports:
      - "9091:9091"

    restart: unless-stopped


networks:
  deployguard-network:
    name: deployguardaisdlc_deployguard-network


volumes:
  grafana-storage:
    name: deployguardaisdlc_grafana-storage